version: "3.9"

services:
  backend:
    image: back_tpo_api_grupo4
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/react_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345678

  frontend:
    build: .
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
